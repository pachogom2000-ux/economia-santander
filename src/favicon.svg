<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Economía Santander">
  <!-- Marca del portal para la pestaña del navegador y para el resultado de
       Google. Se dibuja con geometría, sin texto: un favicon se rasteriza a
       16 px en sitios donde no hay tipografías web, así que unas letras se
       verían con la fuente que hubiera a mano, o con ninguna.

       Tres barras que suben, la última en amarillo: los colores son los del
       cabezote (verde #0B6E3B y amarillo #F5C518) y la figura se lee a 16 px,
       que es donde de verdad se ve. -->
  <rect width="48" height="48" rx="9" fill="#0B6E3B"/>
  <rect x="9"  y="26" width="8" height="13" rx="2" fill="#FFFFFF" opacity="0.92"/>
  <rect x="20" y="19" width="8" height="20" rx="2" fill="#FFFFFF" opacity="0.92"/>
  <rect x="31" y="9"  width="8" height="30" rx="2" fill="#F5C518"/>
</svg>
