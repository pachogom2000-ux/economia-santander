# Se entra con la cuenta de GitHub, no con usuario y contrasena de Netlify.
#
# git-gateway esta deprecado por la propia Decap y solo funciona dentro de
# Netlify, asi que no puede sobrevivir a la migracion. El reemplazo necesita
# alguien que intercambie el codigo de GitHub por un token, porque ese paso usa
# un secreto que no puede vivir en el navegador: eso es el Worker de
# workers/decap-oauth/.
backend:
  name: github
  repo: pachogom2000-ux/economia-santander
  branch: main
  # OBLIGATORIO. Sin base_url, Decap manda el login a https://api.netlify.com,
  # que es su valor por defecto: se saldria de Netlify por la puerta y se
  # volveria a entrar por la ventana.
  base_url: https://economia-santander-auth.digitautom.workers.dev
  auth_endpoint: auth

# Los guardados van a una rama con pull request, no a main.
# Redactar y revisar genera deploy previews, que no consumen creditos.
# Solo el paso final a "Listo" publica y cuesta un deploy de produccion.
publish_mode: editorial_workflow

# El nombre del archivo sale del titulo, y de ahi la direccion publica. Sin
# esto, un titulo con tildes o con ene deja una direccion que hay que codificar
# al compartirla (…gastrofusi%C3%B3n…) y que se ve rota en WhatsApp.
# Solo afecta a lo que se cree de aqui en adelante: lo ya publicado conserva su
# direccion, que es justo lo que se quiere.
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "datos"
    label: "Datos del sitio"
    files:
      - name: "portada"
        label: "Orden de la portada"
        file: "src/_data/destacadas.json"
        format: "json"
        description: >-
          Fija qué notas van arriba y en qué orden. La primera de la lista es la
          nota principal; las siguientes ocupan los cuatro huecos de al lado.
          Lo que no fijes aquí sigue apareciendo debajo, de la más reciente a la
          más vieja. Si dejas la lista vacía manda la fecha, como siempre.
          Acuérdate de soltar una nota cuando deje de ser relevante.
        fields:
          - label: "Notas fijadas, en orden"
            name: "destacadas"
            widget: "list"
            required: false
            hint: "Arrastra para reordenar. La primera es la nota principal de la portada."
            # Aquí había un campo "relation". Decap lo lista por nombre de
            # archivo y solo muestra 20 opciones, así que al pasar de 20 notas
            # las últimas del alfabeto desaparecían del desplegable: la de
            # turismo y la de UVR dejaron de poderse fijar.
            #
            # Decap no permite ordenar un campo de relación por fecha. Por eso
            # las opciones se generan en cada build, de la más reciente a la más
            # antigua: src/admin-config.11ty.js reemplaza la marca de abajo.
            # No escribas las opciones a mano; se pierden en el siguiente build.
            field:
              label: "Nota"
              name: "nota"
              widget: "select"
              # OPCIONES-GENERADAS-EN-EL-BUILD

      - name: "picoyplaca"
        label: "Pico y placa"
        file: "src/_data/picoyplaca.json"
        format: "json"
        description: >-
          Dígitos de la franja superior. Medellín rota por semestres y
          Bucaramanga por trimestres: añade la rotación nueva con su fecha
          de inicio y el sitio cambia solo ese día. No borres la anterior.
        fields:
          - label: "Festivos nacionales"
            name: "festivos"
            widget: "list"
            required: false
            hint: >-
              En festivo no hay pico y placa en ninguna ciudad: la franja marca
              "Libre" sola. Manda sobre las rotaciones y sobre los sábados.
              Carga aquí el calendario del año a comienzos de enero.
            fields:
              - { label: "Fecha", name: "fecha", widget: "string", hint: "Formato AAAA-MM-DD" }
              - { label: "Nombre del festivo", name: "nombre", widget: "string", hint: "Se muestra en la franja: 'festivo: Batalla de Boyacá'" }
          - label: "Ciudades"
            name: "ciudades"
            widget: "list"
            fields:
              - { label: "Ciudad", name: "nombre", widget: "string" }
              - label: "Horario entre semana"
                name: "horario"
                widget: "string"
                hint: "Ejemplo: 6:00 a 20:00"
              - label: "Horario del sábado"
                name: "horarioSabado"
                widget: "string"
                required: false
              - label: "Rotaciones de lunes a viernes"
                name: "rotaciones"
                widget: "list"
                required: false
                hint: "Una por cada cambio oficial. El sitio usa la más reciente que ya haya empezado."
                fields:
                  - { label: "Rige desde", name: "desde", widget: "string", hint: "Formato AAAA-MM-DD, por ejemplo 2026-08-03" }
                  - { label: "Vigencia (nota interna)", name: "vigencia", widget: "string", required: false }
                  - { label: "Lunes", name: "lunes", widget: "string" }
                  - { label: "Martes", name: "martes", widget: "string" }
                  - { label: "Miércoles", name: "miercoles", widget: "string" }
                  - { label: "Jueves", name: "jueves", widget: "string" }
                  - { label: "Viernes", name: "viernes", widget: "string" }
              - label: "Sábados con restricción"
                name: "sabados"
                widget: "list"
                required: false
                hint: "Solo fechas confirmadas por la autoridad de tránsito. Un sábado que no esté aquí se muestra como Libre."
                fields:
                  - { label: "Fecha", name: "fecha", widget: "string", hint: "Formato AAAA-MM-DD" }
                  - { label: "Dígitos", name: "digitos", widget: "string" }
              - label: "Regla por paridad de fecha"
                name: "reglaParidad"
                widget: "object"
                required: false
                hint: "Solo para ciudades como Bogotá, que alternan según el día del mes sea par o impar."
                fields:
                  - { label: "Días impares", name: "impar", widget: "string" }
                  - { label: "Días pares", name: "par", widget: "string" }

  - name: "noticias"
    label: "Noticias"
    folder: "src/noticias"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    # El boton de vista previa del flujo editorial abria la PORTADA del deploy
    # preview, no la nota, asi que habia que buscarla a mano cada vez. Las notas
    # se publican en /noticias/<direccion>/ y esa direccion sale del mismo slug
    # que Decap ya calcula aqui.
    preview_path: "noticias/{{slug}}/"
    fields:
      - { label: "layout", name: "layout", widget: "hidden", default: "noticia.njk" }
      # Este interruptor era invisible en el CMS y ya dejó tres notas mudas
      # (renta el 6 de agosto, cacao el 10, PIB el 14): Francisco las editaba y
      # publicaba una y otra vez, y la marca seguía ahí sin que nadie pudiera
      # verla ni quitarla. Estando a la vista, se controla desde aquí.
      - label: "Dejar como borrador (no sale en el portal)"
        name: "eleventyExcludeFromCollections"
        widget: "boolean"
        default: false
        required: false
        hint: "Encendido, la nota NO aparece en la portada, ni en su sección, ni en el sitemap, y se marca noindex. Apágalo cuando la nota esté lista para salir."
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        # Alineadas una a una con la propiedad "Sección" de la base
        # Publicaciones en Notion. Si añades una aquí, añádela también allí.
        options:
          - "Inversión"
          - "Educación financiera"
          - "Empleo"
          - "Finanzas personales"
          - "Construcción"
          - "Industria"
          - "Agro"
          - "Comercio y consumo"
          - "Turismo y hotelería"
          - "Emprendimiento y pymes"
          - "Impuestos y regulación"
          - "Indicadores económicos"
          - "Opinión"
          - "Entrevistas"
          - "Glosario y guías"
      - label: "Tipo de contenido"
        name: "chipTipo"
        widget: "select"
        default: "propio"
        options:
          - { label: "Redacción propia", value: "propio" }
          - { label: "Recirculado (con fuente)", value: "recirc" }
      - label: "Etiqueta del chip"
        name: "chipLabel"
        widget: "string"
        default: "Propia"
        hint: "Ej: 'Propia' o 'Fuente: DANE'"
      - label: "Resumen"
        name: "excerpt"
        widget: "text"
        hint: "Aparece en la portada y en buscadores (Google, WhatsApp, etc.)"
      - label: "Autor"
        name: "autor"
        widget: "string"
        default: "Francisco Gómez - Director"
        required: false
      - label: "Imagen destacada"
        name: "imagen"
        widget: "image"
        required: false
        hint: "1200 x 700 píxeles y máximo 100 KB. Renombra el archivo antes de subirlo con palabras de la noticia separadas por guiones (ejemplo: empleo-formal-bucaramanga-2026.jpg), nunca IMG_1234.jpg."
      - label: "Texto alternativo de la imagen"
        name: "imagenAlt"
        widget: "string"
        required: false
        hint: "Describe literalmente lo que se ve, incluyendo la palabra clave. Sirve para accesibilidad y para Google Imágenes."
      - label: "Título de la imagen (SEO)"
        name: "imagenTitle"
        widget: "string"
        required: false
        hint: "Título con la palabra clave de la noticia. Si lo dejas vacío se usa el titular."
      - label: "Pie de foto"
        name: "imagenPie"
        widget: "string"
        required: false
        hint: "Frase que se muestra debajo de la imagen."
      - label: "Crédito de la foto"
        name: "imagenCredito"
        widget: "string"
        default: "Foto: Economía Santander"
        required: false
      - label: "¿Es guía o glosario?"
        name: "guia"
        widget: "boolean"
        default: false
        required: false
        hint: "Actívalo si es contenido de consulta permanente (guías, glosarios). Aparece en el bloque 'Glosario y guías' de la portada."
      - label: "Cuerpo de la noticia"
        name: "body"
        widget: "markdown"
        hint: "Para montar un video o una publicación dentro de la nota, pega la dirección SOLA, en su propio párrafo: YouTube, TikTok, Instagram, X, Facebook, LinkedIn, Threads, Vimeo, Spotify y SoundCloud se montan solos. Si el enlace va dentro de una frase, se queda como enlace normal."
      - label: "tags"
        name: "tags"
        widget: "hidden"
        default: "noticias"

  - name: "multimedia"
    label: "Multimedia"
    label_singular: "Contenido multimedia"
    folder: "src/multimedia"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    # Cada contenido tiene desde ahora su propia pagina, no solo una tarjeta
    # dentro de la seccion: /multimedia/<direccion>/. Es la que se comparte.
    preview_path: "multimedia/{{slug}}/"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - label: "Tipo"
        name: "tipo"
        widget: "select"
        default: "video"
        options:
          - { label: "Video (YouTube o archivo propio)", value: "video" }
          - { label: "Podcast", value: "podcast" }
          - { label: "Galería de fotos", value: "galeria" }
          - { label: "Foto", value: "foto" }
          - { label: "Publicación de redes (TikTok, Instagram, X, Facebook…)", value: "red" }
      - label: "Descripción"
        name: "descripcion"
        widget: "text"
        required: false
      - label: "Enlace de la publicación (TikTok, Instagram, X, Facebook, LinkedIn, Threads…)"
        name: "enlace"
        widget: "string"
        required: false
        hint: "Para tipo Publicación de redes. Pega la dirección tal como la copias de la app. Ojo con los enlaces cortos de TikTok (vm.tiktok.com/…): esos no se pueden montar, abre el video en la web y copia la dirección larga."
      - label: "Video de YouTube (URL o ID)"
        name: "youtube"
        widget: "string"
        required: false
        hint: "Solo para tipo Video. Pega la URL completa o el ID, ej: https://www.youtube.com/watch?v=XXXXX"
      - label: "Archivo de video (MP4)"
        name: "archivo"
        widget: "file"
        required: false
        hint: "Alternativa a YouTube: sube el MP4 directamente (clips cortos y comprimidos, ideal menos de 5 MB). Si llenas este campo, se ignora el de YouTube."
      - label: "Podcast en Spotify (URL del episodio)"
        name: "spotify"
        widget: "string"
        required: false
        hint: "Solo para tipo Podcast. Pega el enlace del episodio o del programa."
      - label: "Archivo de audio (MP3)"
        name: "audio"
        widget: "file"
        required: false
        hint: "Alternativa a Spotify para tipo Podcast: sube el MP3 directamente. Aquí va SONIDO, no imágenes: la foto de portada tiene su propio campo, más abajo."
      - label: "Imagen de portada"
        name: "portada"
        widget: "image"
        required: false
        hint: "Es la cara del contenido: la que se ve en la sección, la que abre la ficha y la que sale en la vista previa de WhatsApp. Obligatoria para tipo Foto; en galerías, si falta, se usa la primera foto; en videos de YouTube, si falta, se usa la miniatura de YouTube."
      - label: "Texto alternativo de la portada"
        name: "imagenAlt"
        widget: "string"
        required: false
        hint: "Describe literalmente lo que se ve en la foto de portada. Accesibilidad y Google Imágenes."
      - label: "Fotos de la galería"
        name: "imagenes"
        widget: "list"
        required: false
        field: { label: "Foto", name: "foto", widget: "image" }
      - label: "Fuente o crédito"
        name: "fuente"
        widget: "string"
        required: false

  - name: "declaraciones"
    label: "Declaraciones de gremios"
    files:
      - file: "src/_data/declaraciones.json"
        label: "Lo que dicen los gremios (portada)"
        name: "citas"
        fields:
          - label: "Declaraciones"
            name: "citas"
            widget: "list"
            summary: "{{fields.gremio}} — {{fields.persona}}"
            hint: "Solo citas REALES ya publicadas, con su enlace. Si la lista queda vacía, la sección no aparece en la portada."
            fields:
              - { label: "Gremio o entidad", name: "gremio", widget: "string" }
              - { label: "Cita textual", name: "cita", widget: "text", hint: "Copiada tal cual de la fuente, sin comillas." }
              - { label: "Quién lo dijo", name: "persona", widget: "string" }
              - { label: "Cargo", name: "cargo", widget: "string" }
              - { label: "Medio", name: "medio", widget: "string" }
              - { label: "Fecha", name: "fecha", widget: "string", hint: "Ej: 15 de julio de 2026" }
              - { label: "Enlace a la fuente", name: "url", widget: "string" }

  - name: "redes"
    label: "Redes sociales"
    files:
      - file: "src/_data/redes.json"
        label: "Perfiles del pie de página"
        name: "perfiles"
        fields:
          - label: "Perfiles"
            name: "perfiles"
            widget: "list"
            summary: "{{fields.nombre}}"
            hint: "El que quede SIN dirección no aparece en el pie. Un enlace que no lleva a ninguna parte le quita credibilidad al portal, así que es mejor dejarlo vacío hasta tener el perfil listo."
            fields:
              - { label: "Red", name: "nombre", widget: "string" }
              - { label: "Dirección del perfil", name: "url", widget: "string", required: false, hint: "Completa, empezando por https://. Déjala vacía si todavía no existe el perfil." }

  - name: "publicidad"
    label: "Publicidad"
    files:
      - file: "src/_data/anuncios.json"
        label: "Inventario de anuncios"
        name: "anuncios"
        fields:
          - label: "Anuncios"
            name: "anuncios"
            widget: "list"
            summary: "{{fields.marca}} — {{fields.titular}}"
            fields:
              - { label: "Identificador", name: "id", widget: "string", hint: "Corto, sin espacios y único. Ej: tinto" }
              - { label: "Activo", name: "activo", widget: "boolean", default: true }
              - { label: "Marca / anunciante", name: "marca", widget: "string" }
              - { label: "Titular", name: "titular", widget: "string" }
              - { label: "Texto", name: "texto", widget: "text" }
              - label: "Tipo"
                name: "tipo"
                widget: "select"
                default: "estandar"
                hint: "El tipo Cupón está cableado a la campaña del tinto de Tienda Sinestrés (QR, códigos TINTO-XXX). Para otro anunciante usa Estándar; un cupón nuevo requiere cambios de código."
                options:
                  - { label: "Estándar (clic lleva al sitio)", value: "estandar" }
                  - { label: "Cupón Tinto (solo campaña Tienda Sinestrés)", value: "cupon" }
              - label: "Tema visual"
                name: "tema"
                widget: "select"
                default: "ad-cafe"
                options:
                  - { label: "Café (tonos cálidos)", value: "ad-cafe" }
                  - { label: "Nocturno (azul con destellos)", value: "ad-piro" }
              - { label: "Imagen de fondo", name: "imagen", widget: "image", required: false }
              - { label: "Enlace del anunciante", name: "url", widget: "string" }
              - { label: "Texto del botón", name: "cta", widget: "string" }
              - { label: "Botón secundario (solo cupón)", name: "ctaSecundario", widget: "string", required: false }
              - { label: "Sitio (texto lateral)", name: "sitio", widget: "string", required: false }
              - { label: "Nota lateral", name: "notaLateral", widget: "string", required: false }
              - label: "Categorías donde puede aparecer"
                name: "categorias"
                widget: "select"
                multiple: true
                hint: "El anuncio solo rota en la portada y en las noticias de estas categorías. Si una categoría no tiene ningún anuncio pautado, sus noticias no muestran publicidad."
                options:
                  - "Portada"
                  - "Inversión"
                  - "Educación financiera"
                  - "Empleo"
                  - "Finanzas personales"
                  - "Construcción"
                  - "Industria"
                  - "Agro"
                  - "Nacional"
                  - "Comercio y consumo"
                  - "Turismo y hotelería"
                  - "Emprendimiento y pymes"
                  - "Impuestos y regulación"
                  - "Indicadores económicos"
                  - "Opinión"
                  - "Entrevistas"
                  - "Glosario y guías"
